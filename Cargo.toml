[package]
name = "test_bevy_game"
version = "0.1.0"
edition = "2024"

# Optimization

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# Dependencies

[dependencies]
rand = "0.10.1"
rand_distr = "0.6.0"
rand_core = "0.10.1"
bevy = { version = "0.18.0", features = [
    "dev",
    "experimental_bevy_ui_widgets",
    "experimental_bevy_feathers",
] }
bevy_ecs = "0.18.0"
bevy_rand = "0.14.2"
bevy_mesh = "0.18.0"
bevy_prng = { version = "0.14.2", features = ["chacha20", "wyrand"] }
bevy-inspector-egui = "0.36.0"
noise = "0.9.0"

# Other

[workspace]
resolver = "2"
