[package]
name = "test_bevy_game"
version = "0.1.0"
edition = "2024"

# Optimization

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# Dependencies

[dependencies]
rand = "0.10.1"
rand_distr = "0.6.0"
rand_core = "0.10.1"
bevy = { version = "0.19.1", features = ["dev"] }
bevy_ecs = "0.19.1"
bevy_rand = "0.15.2"
bevy_mesh = "0.19.1"
bevy_prng = { version = "0.15.2", features = ["chacha20", "wyrand"] }
bevy-inspector-egui = "0.37.0"
noise = "0.9.0"
priority-queue = "2.7.0"
worley-noise = "3.7.2"
bytemuck = { version = "1.25.2", features = ["derive"] }
avian3d = "0.7.0"

# Other

[workspace]
resolver = "2"
